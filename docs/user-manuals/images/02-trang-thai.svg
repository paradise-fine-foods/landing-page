<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d">
  <title id="t">Ba trạng thái nội dung</title><desc id="d">Nội dung đi từ Draft sang Published, sau đó có thể chuyển Archived để gỡ khỏi website.</desc><rect width="1200" height="675" fill="#f8fafc"/>
  <text x="600" y="100" text-anchor="middle" fill="#0f172a" font-family="Arial, sans-serif" font-size="36" font-weight="700">Trạng thái nội dung</text>
  <rect x="75" y="210" width="290" height="230" rx="20" fill="#fef3c7" stroke="#d97706" stroke-width="3"/><text x="220" y="285" text-anchor="middle" fill="#78350f" font-family="Arial, sans-serif" font-size="34" font-weight="700">Draft</text><text x="220" y="340" text-anchor="middle" fill="#78350f" font-family="Arial, sans-serif" font-size="21">Đang soạn</text><text x="220" y="375" text-anchor="middle" fill="#78350f" font-family="Arial, sans-serif" font-size="21">Chưa hiển thị</text>
  <path d="M390 325H505" stroke="#475569" stroke-width="7"/><path d="M505 325l-25-17v34z" fill="#475569"/><text x="448" y="295" text-anchor="middle" fill="#334155" font-family="Arial, sans-serif" font-size="19">kiểm tra rồi lưu</text>
  <rect x="530" y="210" width="290" height="230" rx="20" fill="#dcfce7" stroke="#15803d" stroke-width="3"/><text x="675" y="285" text-anchor="middle" fill="#14532d" font-family="Arial, sans-serif" font-size="34" font-weight="700">Published</text><text x="675" y="340" text-anchor="middle" fill="#14532d" font-family="Arial, sans-serif" font-size="21">Sẵn sàng</text><text x="675" y="375" text-anchor="middle" fill="#14532d" font-family="Arial, sans-serif" font-size="21">Hiển thị website</text>
  <path d="M845 325H960" stroke="#475569" stroke-width="7"/><path d="M960 325l-25-17v34z" fill="#475569"/><text x="903" y="295" text-anchor="middle" fill="#334155" font-family="Arial, sans-serif" font-size="19">ngừng dùng</text>
  <rect x="985" y="210" width="160" height="230" rx="20" fill="#e2e8f0" stroke="#64748b" stroke-width="3"/><text x="1065" y="285" text-anchor="middle" fill="#334155" font-family="Arial, sans-serif" font-size="27" font-weight="700">Archived</text><text x="1065" y="340" text-anchor="middle" fill="#334155" font-family="Arial, sans-serif" font-size="20">Đã gỡ</text><text x="1065" y="375" text-anchor="middle" fill="#334155" font-family="Arial, sans-serif" font-size="20">Không xóa</text>
  <text x="600" y="535" text-anchor="middle" fill="#0f172a" font-family="Arial, sans-serif" font-size="23" font-weight="700">Tạo mới: Draft rồi Published</text><text x="600" y="575" text-anchor="middle" fill="#0f172a" font-family="Arial, sans-serif" font-size="23" font-weight="700">Sửa Published: giữ Published, lưu và kiểm tra website</text>
</svg>
