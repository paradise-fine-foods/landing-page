<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d">
  <title id="t">Chọn ảnh trong Public CMS</title><desc id="d">Chọn hoặc tải ảnh vào Public CMS, chọn ảnh cho bản ghi và điền văn bản thay thế theo ngôn ngữ.</desc><rect width="1200" height="675" fill="#f8fafc"/>
  <text x="600" y="85" text-anchor="middle" fill="#0f172a" font-family="Arial, sans-serif" font-size="35" font-weight="700">Dùng hình ảnh trong Public CMS</text>
  <g font-family="Arial, sans-serif"><rect x="75" y="190" width="240" height="245" rx="16" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><text x="195" y="250" text-anchor="middle" fill="#1e3a8a" font-size="28" font-weight="700">1. Chọn ảnh</text><text x="195" y="305" text-anchor="middle" fill="#1e3a8a" font-size="19">hoặc tải ảnh</text><text x="195" y="340" text-anchor="middle" fill="#1e3a8a" font-size="19">từ trường hình</text>
  <rect x="355" y="190" width="240" height="245" rx="16" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text x="475" y="250" text-anchor="middle" fill="#14532d" font-size="28" font-weight="700">2. Public CMS</text><text x="475" y="305" text-anchor="middle" fill="#14532d" font-size="19">Chọn đúng thư mục</text><text x="475" y="340" text-anchor="middle" fill="#14532d" font-size="19">và tệp cần dùng</text>
  <rect x="635" y="190" width="240" height="245" rx="16" fill="#fef3c7" stroke="#d97706" stroke-width="3"/><text x="755" y="250" text-anchor="middle" fill="#78350f" font-size="28" font-weight="700">3. Mô tả ảnh</text><text x="755" y="305" text-anchor="middle" fill="#78350f" font-size="19">Nói ảnh cho thấy gì</text><text x="755" y="340" text-anchor="middle" fill="#78350f" font-size="19">ở từng ngôn ngữ</text>
  <rect x="915" y="190" width="210" height="245" rx="16" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/><text x="1020" y="250" text-anchor="middle" fill="#4c1d95" font-size="25" font-weight="700">4. Lưu đúng</text><text x="1020" y="295" text-anchor="middle" fill="#4c1d95" font-size="18">Tạo mới: Draft</text><text x="1020" y="330" text-anchor="middle" fill="#4c1d95" font-size="18">Sửa: giữ Published</text><text x="1020" y="365" text-anchor="middle" fill="#4c1d95" font-size="18">rồi kiểm tra</text></g>
  <text x="600" y="545" text-anchor="middle" fill="#0f172a" font-family="Arial, sans-serif" font-size="26" font-weight="700">Không dùng hình từ thư mục khác</text>
</svg>
