<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d">
  <title id="t">Hoàn tất nội dung song ngữ</title><desc id="d">Điền tiếng Anh rồi tiếng Việt, kiểm tra đường dẫn và văn bản thay thế, sau đó lưu đúng trạng thái.</desc><rect width="1200" height="675" fill="#f8fafc"/>
  <text x="600" y="84" text-anchor="middle" fill="#0f172a" font-family="Arial, sans-serif" font-size="34" font-weight="700">Hoàn tất nội dung song ngữ</text>
  <g font-family="Arial, sans-serif"><rect x="70" y="175" width="190" height="250" rx="16" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><text x="165" y="235" text-anchor="middle" fill="#1e3a8a" font-size="27" font-weight="700">1. Tiếng Anh</text><text x="165" y="285" text-anchor="middle" fill="#1e3a8a" font-size="19">Tên hoặc tiêu đề</text><text x="165" y="320" text-anchor="middle" fill="#1e3a8a" font-size="19">Đường dẫn</text><text x="165" y="355" text-anchor="middle" fill="#1e3a8a" font-size="19">Nội dung và mô tả</text>
  <rect x="300" y="175" width="190" height="250" rx="16" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text x="395" y="235" text-anchor="middle" fill="#14532d" font-size="27" font-weight="700">2. Tiếng Việt</text><text x="395" y="285" text-anchor="middle" fill="#14532d" font-size="19">Tên hoặc tiêu đề</text><text x="395" y="320" text-anchor="middle" fill="#14532d" font-size="19">Đường dẫn</text><text x="395" y="355" text-anchor="middle" fill="#14532d" font-size="19">Nội dung và mô tả</text>
  <rect x="530" y="175" width="280" height="250" rx="16" fill="#fef3c7" stroke="#d97706" stroke-width="3"/><text x="670" y="235" text-anchor="middle" fill="#78350f" font-size="27" font-weight="700">3. Kiểm tra</text><text x="670" y="285" text-anchor="middle" fill="#78350f" font-size="19">Chữ thường, không dấu</text><text x="670" y="320" text-anchor="middle" fill="#78350f" font-size="19">Dùng gạch nối</text><text x="670" y="355" text-anchor="middle" fill="#78350f" font-size="19">Văn bản thay thế rõ nghĩa</text>
  <rect x="850" y="175" width="280" height="250" rx="16" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/><text x="990" y="235" text-anchor="middle" fill="#4c1d95" font-size="27" font-weight="700">4. Lưu đúng</text><text x="990" y="285" text-anchor="middle" fill="#4c1d95" font-size="19">Tạo mới: Draft</text><text x="990" y="320" text-anchor="middle" fill="#4c1d95" font-size="19">Sửa: giữ Published</text><text x="990" y="355" text-anchor="middle" fill="#4c1d95" font-size="19">rồi kiểm tra</text></g>
  <path d="M265 300h25m205 0h25m295 0h25" stroke="#475569" stroke-width="6"/><text x="600" y="530" text-anchor="middle" fill="#0f172a" font-family="Arial, sans-serif" font-size="26" font-weight="700">Điền cùng thứ tự để không bỏ sót trường</text>
</svg>
