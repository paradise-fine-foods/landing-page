<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d">
  <title id="t">Tạo mới: quy trình xuất bản an toàn</title><desc id="d">Khi tạo nội dung mới, lưu Draft, kiểm tra, chuyển Published và kiểm tra website. Khi sửa Published, giữ Published.</desc><rect width="1200" height="675" fill="#f8fafc"/>
  <text x="600" y="90" text-anchor="middle" fill="#0f172a" font-family="Arial, sans-serif" font-size="35" font-weight="700">Tạo mới: quy trình xuất bản an toàn</text>
  <g font-family="Arial, sans-serif" font-size="21" font-weight="700"><rect x="55" y="245" width="190" height="125" rx="16" fill="#fef3c7" stroke="#d97706" stroke-width="3"/><text x="150" y="295" text-anchor="middle" fill="#78350f">1. Lưu</text><text x="150" y="330" text-anchor="middle" fill="#78350f">Draft</text><rect x="285" y="245" width="190" height="125" rx="16" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><text x="380" y="295" text-anchor="middle" fill="#1e3a8a">2. Kiểm tra</text><text x="380" y="330" text-anchor="middle" fill="#1e3a8a">trường và ảnh</text><rect x="515" y="245" width="190" height="125" rx="16" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text x="610" y="295" text-anchor="middle" fill="#14532d">3. Published</text><text x="610" y="330" text-anchor="middle" fill="#14532d">rồi lưu</text><rect x="745" y="245" width="190" height="125" rx="16" fill="#e0f2fe" stroke="#0891b2" stroke-width="3"/><text x="840" y="295" text-anchor="middle" fill="#164e63">4. Mở</text><text x="840" y="330" text-anchor="middle" fill="#164e63">website</text><rect x="975" y="245" width="170" height="125" rx="16" fill="#e2e8f0" stroke="#64748b" stroke-width="3"/><text x="1060" y="295" text-anchor="middle" fill="#334155">5. Archived</text><text x="1060" y="330" text-anchor="middle" fill="#334155">khi cần gỡ</text></g>
  <path d="M245 307h40m190 0h40m190 0h40m190 0h40" stroke="#475569" stroke-width="6"/><text x="600" y="500" text-anchor="middle" fill="#0f172a" font-family="Arial, sans-serif" font-size="24" font-weight="700">Sửa Published: giữ Published, lưu và kiểm tra website</text><text x="600" y="540" text-anchor="middle" fill="#0f172a" font-family="Arial, sans-serif" font-size="24" font-weight="700">Archived chỉ dùng khi chủ ý gỡ nội dung</text>
</svg>
