<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d">
  <title id="t">Hoàn tất bài viết</title><desc id="d">Bài viết cần hai bản dịch, nội dung định dạng, ảnh có mô tả, ngày đăng và thời gian đọc.</desc><rect width="1200" height="675" fill="#f8fafc"/>
  <text x="600" y="85" text-anchor="middle" fill="#0f172a" font-family="Arial, sans-serif" font-size="35" font-weight="700">Hoàn tất Blog Posts</text>
  <g font-family="Arial, sans-serif"><rect x="70" y="180" width="190" height="270" rx="16" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><text x="165" y="235" text-anchor="middle" fill="#1e3a8a" font-size="25" font-weight="700">1. Bản dịch</text><text x="165" y="285" text-anchor="middle" fill="#1e3a8a" font-size="18">Tiêu đề</text><text x="165" y="320" text-anchor="middle" fill="#1e3a8a" font-size="18">Đường dẫn</text><text x="165" y="355" text-anchor="middle" fill="#1e3a8a" font-size="18">Tóm tắt</text>
  <rect x="300" y="180" width="190" height="270" rx="16" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text x="395" y="235" text-anchor="middle" fill="#14532d" font-size="25" font-weight="700">2. Nội dung</text><text x="395" y="285" text-anchor="middle" fill="#14532d" font-size="18">Soạn định dạng</text><text x="395" y="320" text-anchor="middle" fill="#14532d" font-size="18">Đọc lại</text><text x="395" y="355" text-anchor="middle" fill="#14532d" font-size="18">Kiểm tra bố cục</text>
  <rect x="530" y="180" width="250" height="270" rx="16" fill="#fef3c7" stroke="#d97706" stroke-width="3"/><text x="655" y="235" text-anchor="middle" fill="#78350f" font-size="25" font-weight="700">3. Thông tin</text><text x="655" y="285" text-anchor="middle" fill="#78350f" font-size="18">Ảnh và mô tả ảnh</text><text x="655" y="320" text-anchor="middle" fill="#78350f" font-size="18">Ngày đăng</text><text x="655" y="355" text-anchor="middle" fill="#78350f" font-size="18">Thời gian đọc</text>
  <rect x="820" y="180" width="310" height="270" rx="16" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/><text x="975" y="235" text-anchor="middle" fill="#4c1d95" font-size="25" font-weight="700">4. Lưu đúng</text><text x="975" y="285" text-anchor="middle" fill="#4c1d95" font-size="18">Tạo mới: Draft</text><text x="975" y="320" text-anchor="middle" fill="#4c1d95" font-size="18">Sửa: giữ Published</text><text x="975" y="355" text-anchor="middle" fill="#4c1d95" font-size="18">Mở website</text></g>
  <text x="600" y="555" text-anchor="middle" fill="#0f172a" font-family="Arial, sans-serif" font-size="25" font-weight="700">Kiểm tra bài viết ở cả hai ngôn ngữ</text>
</svg>
